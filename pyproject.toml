[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmf"
version = "3.3.1.2"
description = "Adaptive Civilizational Metabolism Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]
authors = [{name = "ACMF Research Programme"}]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
