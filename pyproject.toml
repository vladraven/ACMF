[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmf"
version = "4.0.0"
description = "ACMF stable baseline research platform package"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "flask", "pyyaml", "requests"]

[tool.setuptools.packages.find]
where = ["src"]
