[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmf"
version = "3.3.1.10"
description = "ACMF clean empirical validation research platform package"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "flask", "pyyaml", "requests"]

[tool.setuptools.packages.find]
where = ["src"]
