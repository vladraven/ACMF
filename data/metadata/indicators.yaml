# =============================================================================
# ACMF DATA PROJECT — INDICATOR METADATA
# =============================================================================
# Each indicator is tagged with:
#   - level:         1=Core ACMF, 2=Institutions, 3=Observation Design
#   - construct:     Which ACMF+ latent variable it proxies (Ch, M, G, V, R, Y, I, etc.)
#   - coverage:      Expected % of countries/years available (0-1)
#   - cost:          Relative cost of acquisition (1=free API, 5=manual/paid)
#   - ovi:           Observed Variable Importance — expected Fisher info gain
#   - source:        Primary data source
#   - api_code:      Machine-readable API identifier
#   - frequency:     Annual / Biennial / Quinquennial
#   - lag:           Typical publication lag in months
#   - quality:       Data quality score (1-5, 5=best)
#   - proxy_for:     Which theoretical construct this proxies
# =============================================================================

indicators:

  # ===========================================================================
  # LEVEL 1 — Core ACMF (Observable State Vector)
  # ===========================================================================

  - id: POP
    name: Population
    level: 1
    construct: Y
