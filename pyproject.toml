[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmf"
version = "3.3.1.6"
description = "Adaptive Civilizational Metabolism Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "requests>=2.31,<3", "pyyaml>=6.0,<7"]
authors = [{name = "ACMF Research Programme"}]

[project.optional-dependencies]
dev = ["pytest"]
datafetch = ["wbdata>=0.3.0", "openpyxl>=3.1.0", "pyreadstat>=1.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"acmf.data" = ["*.csv", "*.yaml"]
