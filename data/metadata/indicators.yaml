# =============================================================================
# OPTIMAL EXPERIMENTAL DESIGN PARAMETERS
# =============================================================================
# Budget constraint: total_cost <= B
# Objective: maximize total Fisher Information I(theta; data)
# Where I = sum over indicators of ovi_i * coverage_i * quality_i / cost_i
#
# Greedy selection algorithm:
#   1. Compute info_gain = ovi * coverage * quality / cost for each indicator
#   2. Sort descending
#   3. Select until budget exhausted
#   4. Ensure at least one indicator per construct (Ch, M, G, V, R, Y, I)
# =============================================================================

experimental_design:
  budget_scenarios:
    - name: "Minimal"
      total_budget: 20
      description: "Core ACMF only, free APIs"
    - name: "Standard"
      total_budget: 50
      description: "Core + Institutions + major Level-3 proxies"
    - name: "Comprehensive"
      total_budget: 100
      description: "Full panel including surveys and proprietary data"
    - name: "Unlimited"
      total_budget: 999
      description: "All available indicators"

  constraints:
    min_indicators_per_construct: 1
    max_missing_per_country_year: 0.40
    require_level_1: true
    require_level_2: false
    interpolation_allowed: true
    interpolation_methods:
      annual: "linear"
      biennial: "spline"
      quinquennial: "locf_then_linear"
